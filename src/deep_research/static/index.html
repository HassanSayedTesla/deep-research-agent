<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deep Research Agent — live agent graph</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Deep Research Agent</h1>
          <p class="brand-sub">LlamaIndex Workflows · multi-agent pipeline</p>
        </div>
      </div>

      <form id="run-form" class="run-form">
        <label class="sr-only" for="topic">Research topic</label>
        <input
          id="topic"
          name="topic"
          type="text"
          autocomplete="off"
          placeholder="How to choose a gearbox for a mobile crane"
          required
          minlength="3"
        />
        <button id="run" type="submit">Research</button>
        <button id="stop" type="button" class="ghost" hidden>Stop</button>
      </form>
    </header>

    <div id="banner" class="banner" hidden role="status"></div>

    <main class="layout">
      <section class="panel graph-panel">
        <div class="panel-head">
          <h2>Agent graph</h2>
          <div class="legend">
            <span class="chip chip-idle">idle</span>
            <span class="chip chip-running">running</span>
            <span class="chip chip-done">done</span>
            <span class="chip chip-loop">feedback</span>
          </div>
        </div>

        <div class="graph-scroll">
          <svg
            id="graph"
            viewBox="0 0 720 520"
            preserveAspectRatio="xMidYMid meet"
            role="img"
            aria-label="Flow chart of the agent pipeline"
          >
            <defs>
              <marker
                id="arrow"
                viewBox="0 0 10 10"
                refX="9"
                refY="5"
                markerWidth="6"
                markerHeight="6"
                orient="auto-start-reverse"
              >
                <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
              </marker>
              <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="6" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <g id="lanes"></g>
            <g id="edges"></g>
            <g id="packets"></g>
            <g id="nodes"></g>
          </svg>
        </div>

        <div class="stats" id="stats"></div>
      </section>

      <section class="panel report-panel">
        <div class="panel-head">
          <h2>Report</h2>
          <span id="report-status" class="status-pill">idle</span>
        </div>
        <article id="report" class="report" aria-live="polite">
          <p class="placeholder">
            The report streams here token by token as the writer works.
          </p>
        </article>
      </section>

      <section class="panel log-panel">
        <div class="panel-head">
          <h2>Event log</h2>
          <button id="clear-log" type="button" class="linkish">clear</button>
        </div>
        <ol id="log" class="log" aria-live="off"></ol>
      </section>
    </main>

    <script src="/static/app.js" type="module"></script>
  </body>
</html>
