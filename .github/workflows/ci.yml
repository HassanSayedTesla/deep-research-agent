name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The whole suite runs offline: fakes stand in for the LLM and for Tavily,
      # so CI needs no keys and cannot be rate-limited.
      - name: Test
        run: pytest -q --junitxml=pytest-report.xml

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Build check
        run: |
          pip install build
          python -m build

      - name: Render the workflow diagram
        # Proves the visualiser still works against the current annotations.
        run: python -m deep_research diagram --output /tmp/diagram.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: pytest-report.xml
          if-no-files-found: ignore

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: deep-research-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name dr -p 8000:8000 deep-research-agent:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              echo "healthy"
              curl -fsS http://127.0.0.1:8000/api/graph | head -c 200
              docker stop dr
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy" >&2
          docker logs dr
          exit 1
